replicaCount: 1

image:
  repository: status-dashboard-api
  tag: "latest"
  pullPolicy: IfNotPresent

config:
  targets: "https://github.com,https://example.com"
  logLevel: INFO

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
